<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match | Card Game</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game">
  <h1>Memory <span>Match</span></h1>
  <p class="tag">Flip the cards and find all the pairs.</p>

  <div class="levels" id="levels" role="group" aria-label="Difficulty">
    <button class="chip on" data-level="easy">Easy</button>
    <button class="chip" data-level="medium">Medium</button>
    <button class="chip" data-level="hard">Hard</button>
  </div>

  <div class="stats">
    <div><small>Moves</small><b id="moves">0</b></div>
    <div><small>Time</small><b id="time">0:00</b></div>
    <div><small>Best</small><b id="best">-</b></div>
  </div>

  <div class="board" id="board"></div>
  <button class="btn" id="restart">New game</button>
</main>

<dialog id="win">
  <h2>You won! 🎉</h2>
  <p id="winText"></p>
  <button class="btn" id="again">Play again</button>
</dialog>
<script src="script.js"></script>
</body>
</html>
